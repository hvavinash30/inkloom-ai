# Render blueprint for the Inkloom FastAPI service.
# The frontend is deployed separately on Vercel.
#
# Free plan notes:
# - The instance sleeps after inactivity, so the first request can take ~30 s.
# - Render's filesystem is ephemeral on the free plan. SQLite and uploaded
#   files reset whenever the service restarts or redeploys. The startup seed
#   recreates the fictional demo workspace, so the demo remains usable.
# - For durable uploads and data, upgrade to a paid instance and attach a disk,
#   then point DATABASE_URL and UPLOAD_DIR at the mount path.
services:
  - type: web
    name: inkloom-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: none
      - key: TRANSCRIPTION_PROVIDER
        value: none
      # Automatic video speech requires manual configuration before it works:
      #   1. set TRANSCRIPTION_PROVIDER=openai_whisper (replace the value above);
      #   2. add TRANSCRIPTION_API_KEY (or OPENAI_API_KEY) as a secret in the
      #      Render dashboard — never in this file or the repository;
      #   3. optionally set TRANSCRIPTION_API_BASE, TRANSCRIPTION_MODEL,
      #      TRANSCRIPTION_LANGUAGE;
      #   4. set OCR_PROVIDER=auto for on-screen frame OCR and confirm the
      #      instance has memory headroom for FFmpeg + RapidOCR (the free plan
      #      was not validated for this workload).
      # FFmpeg is provided by the imageio-ffmpeg package in requirements.txt;
      # set FFMPEG_PATH only to force a different binary. See docs/VIDEO_AUDITING.md.
      # Replace this with the final Vercel production origin if it differs.
      # Must be a JSON array because the setting is parsed as a list.
      - key: CORS_ORIGINS
        value: '["https://inkloom-ai-rho.vercel.app","https://inkloom-ai-team-shrey1.vercel.app"]'
